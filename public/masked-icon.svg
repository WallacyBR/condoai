<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad1)"/>
  
  <!-- Building/condo icon -->
  <g transform="translate(128, 128)">
    <!-- Main building -->
    <rect x="64" y="160" width="128" height="160" fill="white" opacity="0.9"/>
    
    <!-- Windows -->
    <rect x="80" y="180" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="120" y="180" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="160" y="180" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    
    <rect x="80" y="220" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="120" y="220" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="160" y="220" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    
    <rect x="80" y="260" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="120" y="260" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    <rect x="160" y="260" width="24" height="24" fill="#1e293b" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="108" y="280" width="32" height="40" fill="#1e293b" opacity="0.9"/>
    
    <!-- Roof -->
    <polygon points="64,160 128,120 192,160" fill="white" opacity="0.8"/>
    
    <!-- AI symbol -->
    <circle cx="128" cy="100" r="16" fill="white" opacity="0.9"/>
    <text x="128" y="108" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI</text>
  </g>
</svg> 