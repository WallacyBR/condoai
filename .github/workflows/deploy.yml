name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Deploy remoto via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/condoai
            git config --global --add safe.directory /var/www/condoai

            sudo chown -R www-data:www-data /var/www/condoai
            sudo find /var/www/condoai -type f -exec chmod 664 {} \;
            sudo find /var/www/condoai -type d -exec chmod 775 {} \;

            git pull origin master

            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            composer install --no-dev --optimize-autoloader
            php artisan migrate --force

            yarn install
            chmod +x node_modules/.bin/vite
            yarn build

            php artisan config:cache
