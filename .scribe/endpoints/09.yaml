name: 'Manutenção - Relatório Público QR Code'
description: |-

  API para exibir relatório de manutenção via QR Code.
endpoints:
  -
    httpMethods:
      - GET
    uri: 'api/qr/{qr_code_hash}'
    metadata:
      groupName: 'Manutenção - Relatório Público QR Code'
      groupDescription: |-

        API para exibir relatório de manutenção via QR Code.
      subgroup: ''
      subgroupDescription: ''
      title: 'Relatório de Manutenção por QR Code.'
      description: |-
        Exibe informações do equipamento, últimas manutenções realizadas e próxima agendada,
        baseado no hash do QR Code e nas permissões de acesso configuradas.
      authenticated: false
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      qr_code_hash:
        name: qr_code_hash
        description: 'O hash identificador do QR Code do equipamento.'
        required: true
        example: '"a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanUrlParameters:
