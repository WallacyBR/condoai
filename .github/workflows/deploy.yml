name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Deploy remoto via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/condoai
            git config --global --add safe.directory /var/www/condoai

            # Corrige dono do repositório inteiro para evitar erros do git e chmod
            sudo chown -R ubuntu:ubuntu /var/www/condoai

            # Garante permissões corretas
            sudo find /var/www/condoai -type f -exec chmod 664 {} \;
            sudo find /var/www/condoai -type d -exec chmod 775 {} \;

            git pull origin master

            composer install --no-dev --optimize-autoloader
            php artisan migrate --force

            yarn install
            chmod +x node_modules/.bin/vite
            chmod +x node_modules/@esbuild/linux-x64/bin/esbuild
            yarn build

            php artisan config:cache

            # Permissões adequadas para Laravel (NGINX/PHP-FPM usa www-data)
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Inclui logs e sessões explicitamente
            sudo chown -R ubuntu:www-data storage/logs storage/framework/sessions
            sudo chmod -R 775 storage/logs storage/framework/sessions
